<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticia · RIOJANROCK</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .article-page{max-width:920px;margin:0 auto;padding:150px 28px 120px}
    .article-back{display:inline-block;color:#9d9792;text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-size:10px;margin-bottom:45px}
    .article-meta{display:flex;gap:14px;align-items:center;color:#8c8580;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
    .article-meta span{color:var(--red)}
    .article-page h1{font-size:clamp(42px,7vw,82px);line-height:.93;letter-spacing:-2px;margin:0 0 24px;text-transform:uppercase}
    .article-bajada{font-size:21px;line-height:1.5;color:#b0aaa5;max-width:760px;margin:0 0 42px}
    .article-hero{width:100%;display:block;margin:0 0 45px;border:1px solid #302c2a;background:#0d0d0d}
    .article-body{max-width:740px}
    .article-body p{font-size:18px;line-height:1.8;color:#c0bab5;margin:0 0 22px}
    .article-source{border-top:1px solid #302c2a;margin-top:42px;padding-top:20px;font-size:11px;letter-spacing:1.5px;color:#726c67;text-transform:uppercase}
    .article-source strong{color:#b0aaa5}
    .article-actions{margin-top:35px;display:flex;gap:10px;flex-wrap:wrap}

    .article-media{margin:42px 0 38px;padding:22px;border:1px solid #302c2a;background:#101010}
    .article-media-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:12px}
    .article-media-caption{margin:0 0 16px;color:#b0aaa5;font-size:15px;line-height:1.45}
    .article-embed{position:relative;width:100%;overflow:hidden;background:#080808;border:1px solid #302c2a}
    .article-embed.youtube{aspect-ratio:16/9}
    .article-embed.youtube iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .article-embed.spotify iframe{display:block;width:100%;border:0;min-height:152px}
    .article-embed.soundcloud iframe{display:block;width:100%;height:166px;border:0}
    .article-media-link{display:inline-flex;margin-top:4px;color:#fff;background:var(--red);padding:13px 18px;text-decoration:none;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
    @media(max-width:600px){.article-media{padding:15px}.article-media-caption{font-size:13px}}

  </style>
</head>
<body>
  <div class="noise"></div>
  <header class="site-header">
    <a class="brand" href="index.html#inicio" aria-label="RIOJANROCK inicio"><img src="assets/logo.svg" alt="RIOJANROCK"></a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html#radio">Radio</a>
      <a href="index.html#agenda">Agenda</a>
      <a href="noticias.html">Noticias</a>
      <a href="index.html#youtube">YouTube</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
  </header>

  <main class="article-page" id="article">
    <a class="article-back" href="noticias.html">← Volver a noticias</a>
    <div id="articleLoading">CARGANDO…</div>
  </main>

  <script>
    (async () => {
      const root = document.getElementById('article');
      const id = new URLSearchParams(location.search).get('id');
      const esc = value => String(value ?? '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');

      function getYouTubeId(value) {
        try {
          const u = new URL(value);
          const host = u.hostname.toLowerCase().replace(/^www\./, '');
          const allowedHosts = ['youtube.com', 'm.youtube.com', 'youtu.be', 'youtube-nocookie.com'];
          if (!allowedHosts.includes(host)) return '';
          const parts = u.pathname.split('/').filter(Boolean);
          let id = '';
          if (host === 'youtu.be') id = parts[0] || '';
          else if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
          else if (['embed','shorts','live'].includes(parts[0])) id = parts[1] || '';
          return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : '';
        } catch { return ''; }
      }

      function renderMusic(media) {
        if (!media || !media.url || !media.platform) return '';
        let u;
        try { u = new URL(media.url); } catch { return ''; }
        if (u.protocol !== 'https:') return '';

        const platform = String(media.platform).toLowerCase();
        const caption = esc(media.caption || 'Escuchá a la banda');
        let inner = '';

        if (platform === 'youtube') {
          const id = getYouTubeId(u.href);
          if (!id) return '';
          const embed = `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
          inner = `<div class="article-embed youtube"><iframe src="${embed}" title="${caption}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
        } else if (platform === 'spotify') {
          const host = u.hostname.toLowerCase().replace(/^www\./, '');
          const m = u.pathname.match(/^\/(?:embed\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
          if (host !== 'open.spotify.com' || !m) return '';
          const embed = `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
          const height = (m[1] === 'track' || m[1] === 'episode') ? 152 : 352;
          inner = `<div class="article-embed spotify"><iframe src="${embed}" title="${caption}" height="${height}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
        } else if (platform === 'soundcloud') {
          const host = u.hostname.toLowerCase().replace(/^www\./, '');
          if (host !== 'soundcloud.com') return '';
          const embed = `https://w.soundcloud.com/player/?url=${encodeURIComponent(u.href)}&color=%23e5242b&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false`;
          inner = `<div class="article-embed soundcloud"><iframe src="${embed}" title="${caption}" loading="lazy" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
        } else if (platform === 'link') {
          const href = esc(u.href);
          inner = `<a class="article-media-link" href="${href}" target="_blank" rel="noopener noreferrer">ABRIR CONTENIDO ↗</a>`;
        } else {
          return '';
        }

        return `<section class="article-media"><div class="article-media-label">MATERIAL MUSICAL</div><p class="article-media-caption">${caption}</p>${inner}</section>`;
      }

      try {
        const response = await fetch('assets/noticias/noticias.json', { cache:'no-store' });
        if (!response.ok) throw new Error();
        const list = await response.json();
        const item = list.find(x => x.id === id) || list[0];
        if (!item) throw new Error();
        document.title = `${item.titulo} · RIOJANROCK`;
        root.innerHTML = `
          <a class="article-back" href="noticias.html">← Volver a noticias</a>
          <div class="article-meta"><span>${esc(item.categoria)}</span><time>${esc(item.fecha)}</time></div>
          <h1>${esc(item.titulo)}</h1>
          <p class="article-bajada">${esc(item.bajada)}</p>
          <img class="article-hero" src="${esc(item.imagen)}" alt="${esc(item.titulo)}">
          <div class="article-body">${(item.texto || []).map(p => `<p>${esc(p)}</p>`).join('')}</div>
          ${renderMusic(item.materialMusical)}
          <div class="article-source"><strong>Fuente:</strong> ${esc(item.fuente || 'RIOJANROCK')}</div>
          <div class="article-actions">
            <a class="btn btn-red" href="https://www.instagram.com/riojanrock/" target="_blank" rel="noopener">VER RIOJANROCK EN INSTAGRAM ↗</a>
          </div>`;
      } catch (e) {
        root.innerHTML += '<p class="article-bajada">No fue posible cargar la noticia.</p>';
      }
    })();
  </script>
</body>
</html>
