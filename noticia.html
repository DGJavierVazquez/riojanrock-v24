<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticia · RIOJANROCK</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .article-page{max-width:920px;margin:0 auto;padding:150px 28px 120px}
    .article-back{display:inline-block;color:#9d9792;text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-size:10px;margin-bottom:45px}
    .article-meta{display:flex;gap:14px;align-items:center;color:#8c8580;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
    .article-meta span{color:var(--red)}
    .article-page h1{font-size:clamp(42px,7vw,82px);line-height:.93;letter-spacing:-2px;margin:0 0 24px;text-transform:uppercase}
    .article-bajada{font-size:21px;line-height:1.5;color:#b0aaa5;max-width:760px;margin:0 0 42px}
    .article-hero{width:100%;display:block;margin:0 0 45px;border:1px solid #302c2a;background:#0d0d0d}
    .article-body{max-width:740px}
    .article-body p{font-size:18px;line-height:1.8;color:#c0bab5;margin:0 0 22px}
    .article-source{border-top:1px solid #302c2a;margin-top:42px;padding-top:20px;font-size:11px;letter-spacing:1.5px;color:#726c67;text-transform:uppercase}
    .article-source strong{color:#b0aaa5}
    .article-actions{margin-top:35px;display:flex;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="noise"></div>
  <header class="site-header">
    <a class="brand" href="index.html#inicio" aria-label="RIOJANROCK inicio"><img src="assets/logo.svg" alt="RIOJANROCK"></a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html#radio">Radio</a>
      <a href="index.html#agenda">Agenda</a>
      <a href="index.html#noticias">Noticias</a>
      <a href="index.html#youtube">YouTube</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
  </header>

  <main class="article-page" id="article">
    <a class="article-back" href="index.html#noticias">← Volver a noticias</a>
    <div id="articleLoading">CARGANDO…</div>
  </main>

  <script>
    (async () => {
      const root = document.getElementById('article');
      const id = new URLSearchParams(location.search).get('id');
      const esc = value => String(value ?? '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');
      try {
        const response = await fetch('assets/noticias/noticias.json', { cache:'no-store' });
        if (!response.ok) throw new Error();
        const list = await response.json();
        const item = list.find(x => x.id === id) || list[0];
        if (!item) throw new Error();
        document.title = `${item.titulo} · RIOJANROCK`;
        root.innerHTML = `
          <a class="article-back" href="index.html#noticias">← Volver a noticias</a>
          <div class="article-meta"><span>${esc(item.categoria)}</span><time>${esc(item.fecha)}</time></div>
          <h1>${esc(item.titulo)}</h1>
          <p class="article-bajada">${esc(item.bajada)}</p>
          <img class="article-hero" src="${esc(item.imagen)}" alt="${esc(item.titulo)}">
          <div class="article-body">${(item.texto || []).map(p => `<p>${esc(p)}</p>`).join('')}</div>
          <div class="article-source"><strong>Fuente:</strong> ${esc(item.fuente || 'RIOJANROCK')}</div>
          <div class="article-actions">
            <a class="btn btn-red" href="https://www.instagram.com/riojanrock/" target="_blank" rel="noopener">VER RIOJANROCK EN INSTAGRAM ↗</a>
          </div>`;
      } catch (e) {
        root.innerHTML += '<p class="article-bajada">No fue posible cargar la noticia.</p>';
      }
    })();
  </script>
</body>
</html>
