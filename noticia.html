<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index,follow">
  <title>RIOJANROCK — Noticia</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .article-wrap{max-width:1000px;margin:0 auto;padding:76px 22px 120px}
    .article-back{display:inline-block;color:#8f8984;text-decoration:none;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:42px}
    .article-meta{display:flex;gap:12px;color:#8f8984;font-size:10px;letter-spacing:1.8px;text-transform:uppercase}
    .article-meta span{color:var(--red)}
    .article-title{font-size:clamp(48px,8vw,108px);line-height:.9;letter-spacing:-4px;text-transform:uppercase;margin:18px 0 22px;max-width:900px}
    .article-lead{font-size:21px;line-height:1.5;color:#9d9792;max-width:780px;margin-bottom:38px}
    .article-image{display:block;width:100%;max-height:720px;object-fit:cover;background:#080808;margin:28px 0 45px}
    .article-body{max-width:760px;color:#d7d1cc;font-size:18px;line-height:1.75}
    .article-body p{margin:0 0 22px}
    .article-source{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:#77716d;font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
    .article-error{padding:80px 0;color:#999}
  </style>
</head>
<body>
  <main class="article-wrap">
    <a class="article-back" href="index.html#noticias">← VOLVER A NOTICIAS</a>
    <div id="articleContent">
      <div class="article-error">Cargando noticia…</div>
    </div>
  </main>
  <script>
  (() => {
    const root = document.getElementById('articleContent');
    const id = new URLSearchParams(location.search).get('id');

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

    async function load() {
      try {
        if (!id) throw new Error('Falta el identificador de la noticia.');

        const response = await fetch('assets/noticias/noticias.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const items = await response.json();
        const item = items.find(n => n.id === id);
        if (!item) throw new Error('Noticia no encontrada.');

        document.title = `${item.titulo} · RIOJANROCK`;

        root.innerHTML = `
          <div class="article-meta">
            <span>${escapeHtml(item.categoria || 'NOVEDADES')}</span>
            <time>${escapeHtml(item.fecha || '')}</time>
          </div>
          <h1 class="article-title">${escapeHtml(item.titulo)}</h1>
          <p class="article-lead">${escapeHtml(item.bajada || '')}</p>
          ${item.imagen ? `<img class="article-image" src="${escapeHtml(item.imagen)}" alt="${escapeHtml(item.titulo)}">` : ''}
          <div class="article-body">
            ${(item.texto || []).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
          </div>
          <div class="article-source">FUENTE · ${escapeHtml(item.fuente || 'RIOJANROCK')}</div>
        `;
      } catch (error) {
        root.innerHTML = `
          <div class="article-error">
            <strong>No pudimos cargar esta noticia.</strong><br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    load();
  })();
  </script>
</body>
</html>
