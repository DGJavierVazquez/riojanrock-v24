name: Actualizar agenda
on:
  push:
    paths:
      - 'assets/agenda/**'
      - 'generate-agenda.ps1'
jobs:
  agenda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generar agenda
        shell: pwsh
        run: ./generate-agenda.ps1
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agenda/agenda.json assets/agenda/agenda-data.js
          git diff --cached --quiet || git commit -m "Actualizar agenda"
          git push
